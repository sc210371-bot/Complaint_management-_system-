
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #333;
}

/* Header */
header {
    background: #1e3a8a;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 24px;
}

header span {
    font-size: 14px;
}

/* Container */
.container {
    width: 95%;
    max-width: 1400px;
    margin: 25px auto;
}

/* Dashboard */
.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.card h3 {
    color: #666;
    font-size: 15px;
}

.card p {
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

.total {
    border-left: 5px solid #2563eb;
}

.pending {
    border-left: 5px solid #f59e0b;
}

.progress {
    border-left: 5px solid #8b5cf6;
}

.resolved {
    border-left: 5px solid #16a34a;
}

/* Main layout */
.main {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 25px;
}

/* Form */
.form-container,
.table-container {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.form-container h2,
.table-container h2 {
    margin-bottom: 20px;
    color: #1e3a8a;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #2563eb;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.btn {
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-primary:hover {
    background: #1d4ed8;
}

.btn-secondary {
    background: #6b7280;
    color: white;
    margin-left: 5px;
}

/* Toolbar */
.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.toolbar input,
.toolbar select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.search {
    flex: 1;
    min-width: 200px;
}

/* Table */
.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 850px;
}

th {
    background: #1e3a8a;
    color: white;
    padding: 12px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

tr:hover {
    background: #f8fafc;
}

/* Status */
.status {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-progress {
    background: #ede9fe;
    color: #5b21b6;
}

.status-resolved {
    background: #dcfce7;
    color: #166534;
}

.status-rejected {
    background: #fee2e2;
    color: #991b1b;
}

/* Action buttons */
.action-btn {
    padding: 6px 9px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-right: 3px;
}

.view-btn {
    background: #0ea5e9;
    color: white;
}

.edit-btn {
    background: #f59e0b;
    color: white;
}

.delete-btn {
    background: #dc2626;
    color: white;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 90%;
    max-width: 600px;
    border-radius: 10px;
    padding: 25px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 25px;
    cursor: pointer;
    color: #555;
}

.details p {
    margin: 12px 0;
    line-height: 1.5;
}

.details strong {
    color: #1e3a8a;
}

/* Empty */
.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

/* Responsive */
@media (max-width: 1000px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .main {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    header {
        padding: 15px;
    }

    header h1 {
        font-size: 18px;
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .container {
        width: 92%;
    }

    .form-container,
    .table-container {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📋 Complaint Management System</h1>
    <span>Admin Dashboard</span>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="card total">
            <h3>Total Complaints</h3>
            <p id="totalComplaints">0</p>
        </div>

        <div class="card pending">
            <h3>Pending</h3>
            <p id="pendingComplaints">0</p>
        </div>

        <div class="card progress">
            <h3>In Progress</h3>
            <p id="progressComplaints">0</p>
        </div>

        <div class="card resolved">
            <h3>Resolved</h3>
            <p id="resolvedComplaints">0</p>
        </div>

    </div>

    <!-- Main -->
    <div class="main">

        <!-- Complaint Form -->
        <div class="form-container">

            <h2 id="formTitle">Add Complaint</h2>

            <form id="complaintForm">

                <input type="hidden" id="complaintId">

                <div class="form-group">
                    <label>Customer Name</label>
                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter customer name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Product">Product</option>
                        <option value="Service">Service</option>
                        <option value="Billing">Billing</option>
                        <option value="Technical">Technical</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Priority</label>
                    <select id="priority" required>
                        <option value="">Select Priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Complaint</label>
                    <textarea
                        id="description"
                        placeholder="Enter complaint details"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="submitText">Submit Complaint</span>
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="resetForm()"
                >
                    Clear
                </button>

            </form>

        </div>

        <!-- Complaints Table -->
        <div class="table-container">

            <h2>Complaint List</h2>

            <div class="toolbar">

                <input
                    type="text"
                    id="search"
                    class="search"
                    placeholder="🔍 Search complaints..."
                    oninput="loadComplaints()"
                >

                <select id="statusFilter" onchange="loadComplaints()">
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Rejected">Rejected</option>
                </select>

                <select id="categoryFilter" onchange="loadComplaints()">
                    <option value="">All Categories</option>
                    <option value="Product">Product</option>
                    <option value="Service">Service</option>
                    <option value="Billing">Billing</option>
                    <option value="Technical">Technical</option>
                    <option value="Other">Other</option>
                </select>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="complaintTable"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- Details Modal -->
<div class="modal" id="detailsModal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <h2>Complaint Details</h2>

        <div class="details" id="complaintDetails"></div>

    </div>

</div>


<script>

/*
========================================================
COMPLAINT MANAGEMENT API
========================================================

This demo uses localStorage as a fake REST API.

GET     -> getComplaints()
POST    -> createComplaint()
PUT     -> updateComplaint()
DELETE  -> deleteComplaint()

For a real project, replace these functions with
fetch() calls to your backend API.
========================================================
*/


// Initial sample data
const sampleComplaints = [
    {
        id: 1001,
        customerName: "Rahul Sharma",
        email: "rahul@example.com",
        phone: "9876543210",
        category: "Service",
        priority: "High",
        description: "The service was not completed on time.",
        status: "Pending",
        date: "2026-09-01"
    },
    {
        id: 1002,
        customerName: "Priya Patil",
        email: "priya@example.com",
        phone: "9876543211",
        category: "Billing",
        priority: "Medium",
        description: "Incorrect amount was charged on my bill.",
        status: "In Progress",
        date: "2026-09-02"
    },
    {
        id: 1003,
        customerName: "Amit Verma",
        email: "amit@example.com",
        phone: "9876543212",
        category: "Technical",
        priority: "Critical",
        description: "Application is not working after the latest update.",
        status: "Resolved",
        date: "2026-09-03"
    }
];


// Initialize database
if (!localStorage.getItem("complaints")) {
    localStorage.setItem(
        "complaints",
        JSON.stringify(sampleComplaints)
    );
}


/*
========================================================
GET API
========================================================
*/

function getComplaints() {

    return JSON.parse(
        localStorage.getItem("complaints")
    ) || [];

}


/*
========================================================
POST API
========================================================
*/

function createComplaint(complaint) {

    const complaints = getComplaints();

    complaint.id = Date.now();

    complaint.date = new Date()
        .toISOString()
        .split("T")[0];

    complaint.status = "Pending";

    complaints.push(complaint);

    localStorage.setItem(
        "complaints",
        JSON.stringify(complaints)
    );

    return complaint;

}


/*
========================================================
PUT API
========================================================
*/

function updateComplaint(id, updatedData) {

    const complaints = getComplaints();

    const index = complaints.findIndex(
        c => c.id == id
    );

    if (index === -1) {
        return null;
    }

    complaints[index] = {
        ...complaints[index],
        ...updatedData
    };

    localStorage.setItem(
        "complaints",
        JSON.stringify(complaints)
    );

    return complaints[index];

}


/*
========================================================
DELETE API
========================================================
*/

function deleteComplaint(id) {

    let complaints = getComplaints();

    complaints = complaints.filter(
        c => c.id != id
    );

    localStorage.setItem(
        "complaints",
        JSON.stringify(complaints)
    );

}


/*
========================================================
DISPLAY COMPLAINTS
========================================================
*/

function loadComplaints() {

    let complaints = getComplaints();

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const status =
        document.getElementById("statusFilter")
        .value;

    const category =
        document.getElementById("categoryFilter")
        .value;


    // Search filter
    complaints = complaints.filter(c => {

        const text =
            `${c.customerName}
            ${c.email}
            ${c.phone}
            ${c.category}
            ${c.description}`.toLowerCase();

        return text.includes(search);

    });


    // Status filter
    if (status) {

        complaints = complaints.filter(
            c => c.status === status
        );

    }


    // Category filter
    if (category) {

        complaints = complaints.filter(
            c => c.category === category
        );

    }


    const table =
        document.getElementById("complaintTable");

    table.innerHTML = "";


    if (complaints.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No complaints found
                </td>
            </tr>
        `;

        updateDashboard();

        return;
    }


    complaints.forEach(c => {

        const statusClass =
            c.status === "Pending"
                ? "status-pending"
                : c.status === "In Progress"
                ? "status-progress"
                : c.status === "Resolved"
                ? "status-resolved"
                : "status-rejected";


        table.innerHTML += `

            <tr>

                <td>#${c.id}</td>

                <td>
                    <strong>${escapeHTML(c.customerName)}</strong>
                    <br>
                    <small>${escapeHTML(c.email)}</small>
                </td>

                <td>${escapeHTML(c.category)}</td>

                <td>${escapeHTML(c.priority)}</td>

                <td>
                    <span class="status ${statusClass}">
                        ${escapeHTML(c.status)}
                    </span>
                </td>

                <td>${escapeHTML(c.date)}</td>

                <td>

                    <button
                        class="action-btn view-btn"
                        onclick="viewComplaint(${c.id})">
                        View
                    </button>

                    <button
                        class="action-btn edit-btn"
                        onclick="editComplaint(${c.id})">
                        Edit
                    </button>

                    <button
                        class="action-btn delete-btn"
                        onclick="removeComplaint(${c.id})">
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });


    updateDashboard();

}


/*
========================================================
DASHBOARD
========================================================
*/

function updateDashboard() {

    const complaints = getComplaints();

    document.getElementById(
        "totalComplaints"
    ).textContent = complaints.length;


    document.getElementById(
        "pendingComplaints"
    ).textContent =
        complaints.filter(
            c => c.status === "Pending"
        ).length;


    document.getElementById(
        "progressComplaints"
    ).textContent =
        complaints.filter(
            c => c.status === "In Progress"
        ).length;


    document.getElementById(
        "resolvedComplaints"
    ).textContent =
        complaints.filter(
            c => c.status === "Resolved"
        ).length;

}


/*
========================================================
ADD / UPDATE FORM
========================================================
*/

document
.getElementById("complaintForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const id =
        document.getElementById("complaintId").value;


    const data = {

        customerName:
            document.getElementById("customerName").value,

        email:
            document.getElementById("email").value,

        phone:
            document.getElementById("phone").value,

        category:
            document.getElementById("category").value,

        priority:
            document.getElementById("priority").value,

        description:
            document.getElementById("description").value

    };


    if (id) {

        updateComplaint(id, data);

        alert("Complaint updated successfully!");

    } else {

        createComplaint(data);

        alert("Complaint submitted successfully!");

    }


    resetForm();

    loadComplaints();

});


/*
========================================================
EDIT
========================================================
*/

function editComplaint(id) {

    const complaints = getComplaints();

    const complaint =
        complaints.find(c => c.id == id);


    if (!complaint) {
        return;
    }


    document.getElementById(
        "complaintId"
    ).value = complaint.id;


    document.getElementById(
        "customerName"
    ).value = complaint.customerName;


    document.getElementById(
        "email"
    ).value = complaint.email;


    document.getElementById(
        "phone"
    ).value = complaint.phone;


    document.getElementById(
        "category"
    ).value = complaint.category;


    document.getElementById(
        "priority"
    ).value = complaint.priority;


    document.getElementById(
        "description"
    ).value = complaint.description;


    document.getElementById(
        "formTitle"
    ).textContent = "Edit Complaint";


    document.getElementById(
        "submitText"
    ).textContent = "Update Complaint";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
========================================================
RESET FORM
========================================================
*/

function resetForm() {

    document.getElementById(
        "complaintForm"
    ).reset();


    document.getElementById(
        "complaintId"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).textContent = "Add Complaint";


    document.getElementById(
        "submitText"
    ).textContent = "Submit Complaint";

}


/*
========================================================
DELETE
========================================================
*/

function removeComplaint(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this complaint?"
        );


    if (!confirmDelete) {
        return;
    }


    deleteComplaint(id);

    loadComplaints();

    alert("Complaint deleted successfully!");

}


/*
========================================================
VIEW DETAILS
========================================================
*/

function viewComplaint(id) {

    const complaints = getComplaints();

    const complaint =
        complaints.find(c => c.id == id);


    if (!complaint) {
        return;
    }


    document.getElementById(
        "complaintDetails"
    ).innerHTML = `

        <p>
            <strong>Complaint ID:</strong>
            #${complaint.id}
        </p>

        <p>
            <strong>Customer Name:</strong>
            ${escapeHTML(complaint.customerName)}
        </p>

        <p>
            <strong>Email:</strong>
            ${escapeHTML(complaint.email)}
        </p>

        <p>
            <strong>Phone:</strong>
            ${escapeHTML(complaint.phone)}
        </p>

        <p>
            <strong>Category:</strong>
            ${escapeHTML(complaint.category)}
        </p>

        <p>
            <strong>Priority:</strong>
            ${escapeHTML(complaint.priority)}
        </p>

        <p>
            <strong>Status:</strong>
            ${escapeHTML(complaint.status)}
        </p>

        <p>
            <strong>Date:</strong>
            ${escapeHTML(complaint.date)}
        </p>

        <p>
            <strong>Description:</strong><br>
            ${escapeHTML(complaint.description)}
        </p>

        <hr>

        <label>
            <strong>Change Status:</strong>
        </label>

        <select
            id="modalStatus"
            style="
                width:100%;
                padding:10px;
                margin-top:8px;
                border:1px solid #ccc;
                border-radius:6px;
            "
        >

            <option
                value="Pending"
                ${complaint.status === "Pending" ? "selected" : ""}>
                Pending
            </option>

            <option
                value="In Progress"
                ${complaint.status === "In Progress" ? "selected" : ""}>
                In Progress
            </option>

            <option
                value="Resolved"
                ${complaint.status === "Resolved" ? "selected" : ""}>
                Resolved
            </option>

            <option
                value="Rejected"
                ${complaint.status === "Rejected" ? "selected" : ""}>
                Rejected
            </option>

        </select>

        <br>

        <button
            class="btn btn-primary"
            onclick="changeStatus(${complaint.id})">
            Update Status
        </button>

    `;


    document.getElementById(
        "detailsModal"
    ).style.display = "flex";

}


/*
========================================================
CHANGE STATUS
========================================================
*/

function changeStatus(id) {

    const status =
        document.getElementById(
            "modalStatus"
        ).value;


    updateComplaint(id, {
        status: status
    });


    closeModal();

    loadComplaints();

    alert("Complaint status updated!");

}


/*
========================================================
CLOSE MODAL
========================================================
*/

function closeModal() {

    document.getElementById(
        "detailsModal"
    ).style.display = "none";

}


window.onclick = function(event) {

    const modal =
        document.getElementById("detailsModal");

    if (event.target === modal) {

        closeModal();

    }

};


/*
========================================================
SECURITY
========================================================

Prevent HTML injection when displaying user input.
========================================================
*/

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
========================================================
START APPLICATION
========================================================
*/

loadComplaints();

</script>

</body>
</html>
